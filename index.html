<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petri · Living Culture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f3f2ee;
  --panel: #f7f6f2;
  --line: rgba(20, 24, 34, 0.1);
  --line2: rgba(20, 24, 34, 0.2);
  --ink: #15171d;
  --dim: rgba(21, 23, 29, 0.55);
  --faint: rgba(21, 23, 29, 0.35);
  --serif: 'Instrument Serif', 'Times New Roman', serif;
  --mono: 'JetBrains Mono', ui-monospace, 'Consolas', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--mono); overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }

.app { display: flex; height: 100vh; width: 100vw; }

/* ---------- builder ---------- */
#creator { width: 410px; flex: none; height: 100%; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); transition: margin-left .5s ease; }
body.no-panel #creator { margin-left: -410px; }
.cr-head { display: flex; justify-content: space-between; align-items: flex-end; padding: 18px 22px 10px; }
.cr-brand { font-family: var(--serif); font-size: 28px; line-height: .9; letter-spacing: -.01em; }
.cr-meta { font-size: 9.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); text-align: right; line-height: 1.6; }
.cr-meta span { color: var(--faint); }

.pv { position: relative; margin: 4px 22px 0; aspect-ratio: 1 / 0.86; display: flex; align-items: center; justify-content: flex-end; }
.pv-canvas { height: 100%; aspect-ratio: 1; display: block; }
.pv-label { position: absolute; left: 0; bottom: 4px; display: flex; flex-direction: column; gap: 1px; font-size: 10px; pointer-events: none; }
.pv-label b { font-family: var(--serif); font-weight: 400; font-size: 18px; }
.pv-label span { letter-spacing: .06em; }
.pv-label em { font-family: var(--serif); font-size: 13px; color: var(--dim); }
.pv-label small { font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
.pv-ticks { position: absolute; right: 0; bottom: 6px; display: flex; gap: 12px; font-size: 8.5px; color: var(--faint); border-top: 1px solid var(--line2); padding-top: 3px; }

.cr-presets { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.preset { background: none; border: 1px solid transparent; border-radius: 8px; padding: 2px 0 4px; display: flex; flex-direction: column; align-items: center; transition: border-color .2s, background .2s; }
.preset canvas { width: 46px; height: 46px; }
.preset span { font-size: 8.5px; letter-spacing: .04em; color: var(--dim); }
.preset:hover { background: rgba(0,0,0,.025); }
.preset.on { border-color: var(--line2); background: #fff; }
.preset.on span { color: var(--ink); }

.cr-scroll { flex: 1; overflow-y: auto; padding: 4px 22px 18px; scrollbar-width: thin; scrollbar-color: #d4d3cf transparent; }
.cr-sec { padding: 14px 0 6px; border-bottom: 1px solid var(--line); }
.cr-sec:last-child { border-bottom: 0; }
.sec-h { font-family: var(--serif); font-size: 20px; margin-bottom: 10px; display: flex; align-items: baseline; gap: 10px; }
.sec-h span { font-family: var(--mono); font-size: 9px; color: var(--faint); letter-spacing: .1em; }

.ctl { margin-bottom: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { background: none; border: 1px solid var(--line2); border-radius: 99px; padding: 5px 10px; font-size: 10.5px; color: var(--dim); transition: all .15s; }
.chip:hover { color: var(--ink); border-color: rgba(0,0,0,.4); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chips.with-desc { display: grid; grid-template-columns: 1fr 1fr; }
.chips.with-desc .chip { border-radius: 10px; text-align: left; padding: 8px 10px; }
.chips.with-desc small { display: block; font-size: 9px; opacity: .65; margin-top: 2px; }

.range label { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--dim); margin-bottom: 3px; }
.range output { color: var(--ink); font-size: 10px; }
.range input { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: transparent; margin: 0; --p: 50%; }
.range input::-webkit-slider-runnable-track { height: 1px; background: linear-gradient(90deg, var(--ink) var(--p), var(--line2) var(--p)); }
.range input::-moz-range-track { height: 1px; background: var(--line2); }
.range input::-moz-range-progress { height: 1px; background: var(--ink); }
.range input::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--ink); margin-top: -5px; box-shadow: 0 0 0 4px rgba(0,0,0,.05); }
.range input::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--ink); }

.swatches { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background-color: #fff; padding: 0; outline: 1px solid transparent; outline-offset: 2px; transition: outline-color .15s, transform .15s; }
.sw:hover { transform: scale(1.08); }
.sw.on { outline-color: var(--ink); }
.sw-name { width: 100%; font-size: 10px; color: var(--dim); }
.swatches.small { margin-top: 4px; }
.ctl-l { width: 100%; font-size: 10.5px; color: var(--dim); }
.sw.sm { width: 20px; height: 20px; font-size: 9px; color: var(--dim); }

.name-row { display: flex; gap: 6px; }
.name-in { flex: 1; background: #fff; border: 1px solid var(--line2); border-radius: 8px; color: var(--ink); font: 13px var(--mono); padding: 8px 10px; letter-spacing: .06em; outline: none; }
.name-in:focus { border-color: rgba(0,0,0,.45); }

.cr-foot { display: flex; gap: 8px; padding: 14px 22px 18px; border-top: 1px solid var(--line); }
.btn-ghost { background: none; border: 1px solid var(--line2); border-radius: 99px; padding: 0 14px; font-size: 11px; color: var(--dim); }
.btn-ghost:hover { color: var(--ink); border-color: rgba(0,0,0,.45); }
.btn-send { flex: 1; height: 44px; border: 0; border-radius: 99px; background: var(--ink); color: var(--paper); font-size: 12px; letter-spacing: .04em; display: flex; justify-content: center; align-items: center; gap: 10px; transition: transform .15s, background .3s; }
.btn-send:hover { background: #000; transform: translateY(-1px); }
.btn-send span { font-family: var(--serif); font-size: 18px; }
.btn-send.busy { opacity: .4; pointer-events: none; }

/* ---------- dish ---------- */
.dish-wrap { position: relative; flex: 1; height: 100%; background: var(--paper); }
#dish { position: absolute; inset: 0; }
.dish-root { overflow: hidden; }
.dish-root > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.dish-scene { }
.dish-grain { pointer-events: none; mix-blend-mode: multiply; opacity: .55; }
.dish-root.night .dish-grain { mix-blend-mode: normal; opacity: .4; }
.dish-overlay, .dish-labels, .dish-hud { pointer-events: none; }
.tag i, .tag i::before { transition: background 1.8s ease; }

.tag { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 1.2s ease, color 1.8s ease; font-size: 10px; color: rgba(16,20,30,.85); white-space: nowrap; display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; padding-left: 46px; }
.tag.on { opacity: 1; }
.tag i { position: absolute; left: 0; top: 7px; width: 40px; height: 1px; background: rgba(16,20,30,.5); }
.tag i::before { content: ''; position: absolute; left: -3px; top: -2px; width: 5px; height: 5px; border-radius: 50%; background: rgba(16,20,30,.8); }
.tag b { font-family: var(--serif); font-weight: 400; font-size: 15px; }
.tag span { letter-spacing: .06em; }
.tag small { grid-column: 1 / 3; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; opacity: .6; margin-top: 1px; }
.tag em { grid-column: 1 / 3; font-family: var(--serif); font-size: 12px; color: rgba(16,20,30,.5); }
.dish-root.night .tag { color: rgba(255,255,255,.88); }
.dish-root.night .tag i, .dish-root.night .tag i::before { background: rgba(255,255,255,.65); }
.dish-root.night .tag em { color: rgba(255,255,255,.55); }

.dish-hud { font-size: 9.5px; letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.dish-hud > div { position: absolute; line-height: 1.8; }
.hud-tl { left: 28px; top: 24px; } .hud-tr { right: 28px; top: 70px; text-align: right; }
.hud-bl { left: 28px; bottom: 24px; } .hud-br { right: 28px; bottom: 64px; text-align: right; }
.hud-title { font-family: var(--serif); font-size: 22px; letter-spacing: 0; text-transform: none; color: var(--ink); line-height: 1.1; margin-bottom: 2px; }
.hud-scale { display: flex; align-items: center; gap: 8px; }
.hud-scale span { display: inline-block; width: 60px; height: 1px; background: var(--dim); position: relative; }
.hud-scale span::before, .hud-scale span::after { content: ''; position: absolute; top: -3px; width: 1px; height: 7px; background: var(--dim); }
.hud-scale span::after { right: 0; }
.hud-fps { color: var(--faint); }

.dish-tools { position: absolute; right: 24px; bottom: 20px; display: flex; gap: 4px; opacity: .5; transition: opacity .3s; }
.dish-tools:hover { opacity: 1; }
.dish-tools button { background: rgba(255,255,255,.6); border: 1px solid var(--line2); border-radius: 99px; padding: 5px 10px; font-size: 10px; color: var(--dim); backdrop-filter: blur(6px); }
.dish-tools button:hover { color: var(--ink); }

.fly { position: fixed; z-index: 50; pointer-events: none; transform-origin: 50% 50%; will-change: transform, opacity; }
.fly canvas { display: block; }

/* light menu */
.light-menu { position: absolute; right: 24px; top: 20px; z-index: 5; }
.lm-btn { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 14px 0 12px; border-radius: 99px; border: 1px solid var(--line2); background: rgba(255,255,255,.7); backdrop-filter: blur(8px); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); transition: border-color .2s, color .2s; }
.lm-btn:hover, .light-menu.open .lm-btn { color: var(--ink); border-color: rgba(0,0,0,.4); }
.lm-burger { display: grid; gap: 3px; width: 14px; }
.lm-burger i { display: block; height: 1px; background: currentColor; transition: transform .3s, opacity .3s; }
.light-menu.open .lm-burger i:nth-child(1) { transform: translateY(4px) rotate(45deg); }
.light-menu.open .lm-burger i:nth-child(2) { opacity: 0; }
.light-menu.open .lm-burger i:nth-child(3) { transform: translateY(-4px) rotate(-45deg); }
.lm-cur { color: var(--ink); letter-spacing: .06em; text-transform: none; font-family: var(--serif); font-size: 15px; }
.lm-list { position: absolute; right: 0; top: 44px; width: 280px; padding: 6px; border-radius: 16px; background: rgba(250,249,246,.92); backdrop-filter: blur(14px); border: 1px solid var(--line); box-shadow: 0 18px 40px rgba(20,24,34,.12); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .2s, transform .2s; }
.light-menu.open .lm-list { opacity: 1; transform: none; pointer-events: auto; }
.lm-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 10px; border: 0; border-radius: 11px; background: none; text-align: left; }
.lm-item:hover { background: rgba(0,0,0,.04); }
.lm-item.on { background: #fff; box-shadow: inset 0 0 0 1px var(--line2); }
.lm-sw { width: 30px; height: 30px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
.lm-t { display: flex; flex-direction: column; gap: 1px; }
.lm-t b { font-family: var(--serif); font-weight: 400; font-size: 17px; color: var(--ink); }
.lm-t small { font-size: 9.5px; color: var(--dim); letter-spacing: .02em; }

</style>
</head>
<body>
<div class="app">
  <aside id="creator"></aside>
  <main class="dish-wrap">
    <div id="dish"></div>
    <div class="light-menu">
      <button class="lm-btn" aria-expanded="false"><span class="lm-burger"><i></i><i></i><i></i></span><span class="lm-k">Light</span><span class="lm-cur"></span></button>
      <div class="lm-list"></div>
    </div>
    <nav class="dish-tools">
      <button data-act="tags" title="T">Labels</button>
      <button data-act="clear" title="Del">Clear</button>
      <button data-act="full" title="F">Fullscreen</button>
      <button data-act="panel" title="H">Panel</button>
    </nav>
  </main>
</div>
<script>
/* Petri v2 — core: noise, palettes, genome, procedural microbe renderer */
(function () {
  'use strict';
  const TAU = Math.PI * 2;
  const P = (window.Petri = {});
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  P.TAU = TAU; P.clamp = clamp; P.lerp = lerp; P.smooth = smooth;
  P.rand = (a, b) => a + Math.random() * (b - a);
  P.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function mulberry(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  P.mulberry = mulberry;

  /* ---------- periodic value noise ---------- */
  const NS = 256, NM = 255;
  const ntex = new Float32Array(NS * NS);
  (function () {
    const r = mulberry(1337);
    function lattice(freq) {
      const g = new Float32Array(freq * freq);
      for (let i = 0; i < g.length; i++) g[i] = r();
      return (u, v) => {
        const fx = u * freq, fy = v * freq;
        const ix = Math.floor(fx), iy = Math.floor(fy);
        let tx = fx - ix, ty = fy - iy;
        tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
        const i0 = ix % freq, i1 = (ix + 1) % freq, j0 = iy % freq, j1 = (iy + 1) % freq;
        const a = g[j0 * freq + i0], b = g[j0 * freq + i1], c = g[j1 * freq + i0], d = g[j1 * freq + i1];
        return lerp(lerp(a, b, tx), lerp(c, d, tx), ty);
      };
    }
    const o1 = lattice(8), o2 = lattice(16), o3 = lattice(32);
    let mn = 9, mx = -9;
    for (let y = 0; y < NS; y++) for (let x = 0; x < NS; x++) {
      const u = x / NS, v = y / NS;
      const n = o1(u, v) * 0.55 + o2(u, v) * 0.3 + o3(u, v) * 0.15;
      ntex[y * NS + x] = n; if (n < mn) mn = n; if (n > mx) mx = n;
    }
    for (let i = 0; i < ntex.length; i++) ntex[i] = (ntex[i] - mn) / (mx - mn);
  })();
  function nz(x, y) {
    x *= 32; y *= 32;
    let ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    ix &= NM; iy &= NM;
    const ix1 = (ix + 1) & NM, iy1 = (iy + 1) & NM;
    const a = ntex[iy * NS + ix], b = ntex[iy * NS + ix1], c = ntex[iy1 * NS + ix], d = ntex[iy1 * NS + ix1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  P.nz = nz;

  /* ---------- colour ---------- */
  function hex(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
  function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
  function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a.toFixed(3) + ')'; }
  P.hex = hex; P.mix = mix; P.rgba = rgba;

  // one gamut shared by organisms and the dish (pastel-neon, from the scent-map references)
  P.palettes = [
    { id: 'lagoon', name: 'Lagoon', edge: '#1fb5b0', mid: '#86e8de', hot: '#fffbe2', rim: '#0f8fa8', rim2: '#7d6bff', app: '#3b6fe0', aura: '#7fdcd4' },
    { id: 'blush', name: 'Blush', edge: '#ff6fae', mid: '#ffb09a', hot: '#fff3c6', rim: '#f2408c', rim2: '#ffae3d', app: '#a58cff', aura: '#ffb3d4' },
    { id: 'lilac', name: 'Lilac', edge: '#9179ff', mid: '#d8b6ff', hot: '#ffffff', rim: '#5f45ff', rim2: '#ff7fc0', app: '#4fc6e6', aura: '#c4b4ff' },
    { id: 'cobalt', name: 'Cobalt', edge: '#2c5ce0', mid: '#62c6ff', hot: '#ecfcff', rim: '#1a3ccf', rim2: '#2fdcbc', app: '#ff86c2', aura: '#8eb0ff' },
    { id: 'coral', name: 'Coral', edge: '#ff5560', mid: '#ff9b5e', hot: '#ffeaa2', rim: '#e42c50', rim2: '#ff6fd0', app: '#1fb5b0', aura: '#ffa79e' },
    { id: 'lemon', name: 'Lemon', edge: '#a9d43c', mid: '#f1ea62', hot: '#ffffff', rim: '#6fae1e', rim2: '#2fcfae', app: '#ff853a', aura: '#e8ec86' },
    { id: 'prism', name: 'Prism', edge: '#58cbe6', mid: '#ffb0e4', hot: '#fffbd2', rim: '#6a5cff', rim2: '#ff5e9e', app: '#e8de4a', aura: '#d6c6ff' },
    { id: 'ember', name: 'Ember', edge: '#ff8538', mid: '#ff5c9e', hot: '#fff0b2', rim: '#df4a2f', rim2: '#8f78ff', app: '#2c5ce0', aura: '#ffbd96' },
  ];
  P.appSwatches = ['auto', '#3b6fe0', '#1fb5b0', '#7d6bff', '#ff6fae', '#ff853a', '#e8de4a', '#86e8de', '#ffffff'];

  P.SHAPES = [
    { id: 'round', name: 'Sphere' }, { id: 'capsule', name: 'Rod' }, { id: 'dumbbell', name: 'Dividing' },
    { id: 'liquid', name: 'Liquid' }, { id: 'ring', name: 'Ring' }, { id: 'colony', name: 'Colony' },
  ];
  P.APPS = [
    { id: 'none', name: 'None' }, { id: 'villi', name: 'Villi' }, { id: 'cilia', name: 'Cilia' },
    { id: 'spikes', name: 'Spines' }, { id: 'tentacles', name: 'Tentacles' },
  ];
  P.TEXTURES = [{ id: 'smooth', name: 'Smooth' }, { id: 'spots', name: 'Spots' }, { id: 'veins', name: 'Veins' }, { id: 'dots', name: 'Halftone' }];
  P.TEMPERS = [
    { id: 'drifter', name: 'Drifter', desc: 'swims in slow circles' },
    { id: 'curious', name: 'Curious', desc: 'borrows colour from others' },
    { id: 'hyper', name: 'Restless', desc: 'bumps others away' },
    { id: 'social', name: 'Social', desc: 'drifts close, hangs out' },
  ];

  const BASE = {
    shape: 'round', scale: 0.5, length: 0.5, width: 0.5, pinch: 0.5, fluidity: 0.3, lumpiness: 0.15,
    transparency: 0.45, rim: 0.7, haze: 0.35, aura: 0.6,
    nuclei: 1, nucleusSize: 0.5, glow: 0.8, granules: 0.4, texture: 'smooth',
    appType: 'villi', appCount: 0.5, appLength: 0.4, appThickness: 0.5, appCurl: 0.4, appSpeed: 0.4,
    flagella: 0, flagLength: 0.5,
    palette: 0, appColor: 'auto', temperament: 'drifter',
  };
  P.presets = [
    { name: 'Coccus', g: { shape: 'round', length: 0.45, width: 0.6, fluidity: 0.25, lumpiness: 0.2, nuclei: 1, nucleusSize: 0.65, glow: 0.9, texture: 'dots', granules: 0.5, appType: 'villi', appCount: 0.4, appLength: 0.3, appThickness: 0.45, palette: 0, temperament: 'drifter' } },
    { name: 'Bacillus', g: { shape: 'capsule', length: 0.6, width: 0.45, fluidity: 0.2, lumpiness: 0.05, nuclei: 2, nucleusSize: 0.4, appType: 'cilia', appCount: 0.7, appLength: 0.35, appThickness: 0.35, flagella: 1, flagLength: 0.6, palette: 3, temperament: 'hyper' } },
    { name: 'Diplo', g: { shape: 'dumbbell', length: 0.55, width: 0.65, pinch: 0.6, nuclei: 2, nucleusSize: 0.55, glow: 1, appType: 'villi', appCount: 0.55, appLength: 0.42, appThickness: 0.6, appCurl: 0.5, palette: 2, temperament: 'curious' } },
    { name: 'Amoeba', g: { shape: 'liquid', length: 0.5, width: 0.6, fluidity: 0.85, lumpiness: 0.35, nuclei: 3, nucleusSize: 0.45, texture: 'veins', granules: 0.5, haze: 0.5, appType: 'none', palette: 1, temperament: 'drifter' } },
    { name: 'Annulus', g: { shape: 'ring', length: 0.5, width: 0.45, nuclei: 0, granules: 0.95, transparency: 0.55, rim: 0.9, appType: 'cilia', appCount: 0.35, appLength: 0.2, palette: 6, temperament: 'social' } },
    { name: 'Colony', g: { shape: 'colony', width: 0.55, lumpiness: 0.4, nuclei: 3, nucleusSize: 0.5, granules: 0.6, texture: 'spots', appType: 'cilia', appCount: 0.4, appLength: 0.25, appThickness: 0.3, palette: 7, temperament: 'drifter' } },
    { name: 'Anemone', g: { shape: 'round', scale: 0.5, length: 0.5, width: 0.5, nuclei: 1, nucleusSize: 0.7, glow: 0.8, texture: 'veins', appType: 'tentacles', appCount: 0.75, appLength: 0.55, appThickness: 0.45, appCurl: 0.3, appSpeed: 0.25, palette: 4, temperament: 'curious' } },
  ];
  P.makeGenome = function (over) {

  };
  const NUM_KEYS = ['scale', 'length', 'width', 'pinch', 'fluidity', 'lumpiness', 'transparency', 'rim', 'haze', 'aura', 'nucleusSize', 'glow', 'granules', 'appCount', 'appLength', 'appThickness', 'appCurl', 'appSpeed', 'flagLength'];
  P.randomGenome = function () {
    const pr = P.pick(P.presets);

    if (Math.random() < 0.5) g.palette = Math.floor(Math.random() * P.palettes.length);
    if (Math.random() < 0.3) g.nuclei = Math.floor(Math.random() * 5);

  const CODES = ['b0b', 'r4y', 'zz', '42', 'n0va', 'ix', 'mo', 'k1t', 'lux', '00', 'p1p', 'w4v', 'gl0', 'yum', 'fizz', 'b52', 'tip', 'x3', 'boi', 'r3x', 'dot', 'q7', 'neo', 'ufo'];
  P.makeName = function () {

  };
  const GENUS = { round: 'Coccus', capsule: 'Bacillus', dumbbell: 'Diplococcus', liquid: 'Amoeba', ring: 'Annulus', colony: 'Colonia' };
  const SPECIES = ['lagunae', 'rubescens', 'lilacina', 'cobaltica', 'corallina', 'citrina', 'iridescens', 'ignea'];
  P.latinName = (g) => (GENUS[g.shape] || 'Microbium') + ' ' + SPECIES[g.palette % SPECIES.length];

  /* ---------- shared sprites for background life ---------- */
  const spriteCache = new Map();
  P.orb = function (col, kind) {
    const key = col + '|' + kind;
    if (spriteCache.has(key)) return spriteCache.get(key);
    if (spriteCache.size > 500) spriteCache.clear();
    const S = 96, c = document.createElement('canvas'); c.width = c.height = S;
    const x = c.getContext('2d'), rgb = hex(col), h = S / 2, W = [255, 255, 255];
    let g;
    if (kind === 'soft') {
      g = x.createRadialGradient(h, h, 0, h, h, h);
      g.addColorStop(0, rgba(rgb, 1)); g.addColorStop(0.35, rgba(rgb, 0.55)); g.addColorStop(1, rgba(rgb, 0));
      x.fillStyle = g; x.fillRect(0, 0, S, S);
    } else if (kind === 'rings') { // concentric "scent" mark
      g = x.createRadialGradient(h, h, 0, h, h, h);
      g.addColorStop(0, rgba(rgb, 0.9)); g.addColorStop(0.25, rgba(rgb, 0.55)); g.addColorStop(0.7, rgba(rgb, 0.18)); g.addColorStop(1, rgba(rgb, 0));
      x.fillStyle = g; x.fillRect(0, 0, S, S);

        x.strokeStyle = rgba(mix(rgb, W, 0.35), 0.35 * (1 - i / 7)); x.lineWidth = 1.2;
        x.beginPath(); x.arc(h, h, (i / 7) * h, 0, TAU); x.stroke();
      }
    } else if (kind === 'ring') { // bokeh ring
      g = x.createRadialGradient(h, h, 0, h, h, h);
      g.addColorStop(0, rgba(rgb, 0.16)); g.addColorStop(0.72, rgba(rgb, 0.28)); g.addColorStop(0.86, rgba(mix(rgb, W, 0.3), 0.85)); g.addColorStop(1, rgba(rgb, 0));
      x.fillStyle = g; x.fillRect(0, 0, S, S);
    } else if (kind === 'dorb') { // translucent cell, darker rim (for light field)
      const dk = mix(rgb, [20, 30, 60], 0.28);
      g = x.createRadialGradient(h * 0.85, h * 0.85, 0, h, h, h);
      g.addColorStop(0, rgba(mix(rgb, W, 0.55), 0.7)); g.addColorStop(0.5, rgba(rgb, 0.35)); g.addColorStop(0.7, rgba(rgb, 0.5));
      g.addColorStop(0.8, rgba(dk, 0.75)); g.addColorStop(0.88, rgba(rgb, 0.25)); g.addColorStop(1, rgba(rgb, 0));
      x.fillStyle = g; x.fillRect(0, 0, S, S);
    } else { // orb (glowing rim)
      g = x.createRadialGradient(h * 0.85, h * 0.85, 0, h, h, h);
      g.addColorStop(0, rgba(mix(rgb, W, 0.35), 0.75)); g.addColorStop(0.45, rgba(rgb, 0.35)); g.addColorStop(0.68, rgba(rgb, 0.45));
      g.addColorStop(0.78, rgba(mix(rgb, W, 0.25), 0.95)); g.addColorStop(0.86, rgba(rgb, 0.35)); g.addColorStop(1, rgba(rgb, 0));

  };

  /* ================= Microbe ================= */
  const T0 = 0.371;
  const APP_LEN_MULT = { none: 0, villi: 1, cilia: 0.8, spikes: 1.2, tentacles: 1.35 };

  class Microbe {
    constructor(g, opts) {
      opts = opts || {};
      this.N = opts.res || 112;
      this.body = document.createElement('canvas');
      this.body.width = this.body.height = this.N;
      this.bctx = this.body.getContext('2d');
      this.img = this.bctx.createImageData(this.N, this.N);
      this.sprite = document.createElement('canvas'); this.sctx = this.sprite.getContext('2d');
      this.out = document.createElement('canvas'); this.octx = this.out.getContext('2d');
      this.out2 = document.createElement('canvas'); this.octx2 = this.out2.getContext('2d'); // double buffer: previous image stays valid
      this.mk = document.createElement('canvas'); this.mctx = this.mk.getContext('2d');
      this.mask = document.createElement('canvas'); this.mask.width = this.mask.height = 48;
      this.maskCtx = this.mask.getContext('2d'); this.maskImg = this.maskCtx.createImageData(48, 48);
      this.maskT = -99;
      this.motion = 1;
      this.setGenome(g);
    }
    setGenome(g) { this.g = g; this.build(); this.update(0); }

    build() {
      const g = this.g, r = mulberry(g.seed || 1);
      const balls = [];
      const B = (x, y, rad, amp) => balls.push({ x, y, r: rad, amp: amp == null ? 1 : amp, f: lerp(0.25, 0.7, r()), ph: r() * TAU, f2: lerp(0.2, 0.6, r()), ph2: r() * TAU });
      const L = lerp(0.35, 1.25, g.length), W = lerp(0.5, 1.0, g.width);
      let fluidK = 0.15;
      switch (g.shape) {
        case 'capsule': {
          const n = Math.max(3, Math.round(2 + L * 4));
          for (let i = 0; i < n; i++) B(lerp(-L, L, i / (n - 1)), 0, W * 0.78);
          break;
        }
        case 'dumbbell': {
          const LL = L * 0.9 + 0.2;
          B(-LL, 0, W); B(LL, 0, W);
          const mr = W * lerp(0.9, 0.32, g.pinch);
          B(-LL * 0.45, 0, lerp(W, mr, 0.5)); B(0, 0, mr); B(LL * 0.45, 0, lerp(W, mr, 0.5));
          break;
        }
        case 'liquid': {
          fluidK = 0.38;
          B(0, 0, W * 0.95);
          for (let i = 0; i < 5; i++) {
            const a = (i / 5) * TAU + r() * 0.8, d = lerp(0.35, 0.75, r()) * (0.7 + L * 0.5);
            B(Math.cos(a) * d * 1.2, Math.sin(a) * d, lerp(0.45, 0.7, r()) * W);
          }
          break;
        }
        case 'ring': {
          const Rr = lerp(0.75, 1.3, g.length), br = lerp(0.28, 0.5, g.width), n = 14;
          for (let i = 0; i < n; i++) { const a = (i / n) * TAU; B(Math.cos(a) * Rr, Math.sin(a) * Rr * 0.92, br); }
          break;
        }
        case 'colony': {
          const rc = lerp(0.45, 0.68, g.width), n = 3 + Math.floor(r() * 3) + Math.round(g.length * 1.5);
          B(0, 0, rc);
          for (let i = 1; i < n; i++) {
            const base = balls[Math.floor(r() * balls.length)];
            const a = r() * TAU, d = rc * lerp(1.15, 1.45, r());
            let x = base.x + Math.cos(a) * d, y = base.y + Math.sin(a) * d * 0.85;
            const m = Math.hypot(x, y); if (m > 1.8) { x *= 1.8 / m; y *= 1.8 / m; }
            B(x, y, rc * lerp(0.75, 1.05, r()));
          }
          let cx = 0, cy = 0; balls.forEach((b) => { cx += b.x; cy += b.y; }); cx /= balls.length; cy /= balls.length;
          balls.forEach((b) => { b.x -= cx; b.y -= cy; });
          break;
        }
        default: {
          const R0 = lerp(0.85, 1.25, g.width) * lerp(0.9, 1.12, g.length);

          for (let i = 0; i < 5; i++) { const a = (i / 5) * TAU + r(); B(Math.cos(a) * R0 * 0.5, Math.sin(a) * R0 * 0.5, R0 * 0.5); }

      let rb = 0;
      balls.forEach((b) => { rb = Math.max(rb, Math.hypot(b.x, b.y) + b.r + b.amp); });

      this.E = this.rMax * 1.22;

      const nn = g.nuclei | 0;
      const nuc = [];
      const sig = lerp(0.16, 0.42, g.nucleusSize) * (g.shape === 'colony' ? 0.75 : g.shape === 'ring' ? 0.6 : 1);
      const sorted = balls.map((b, i) => i).sort((a, b) => balls[b].r - balls[a].r);
      for (let k = 0; k < nn; k++) {
        let bi, ox = 0, oy = 0;

        else if (g.shape === 'capsule') { bi = clamp(Math.round(((k + 0.5) / nn) * (nb - 1)), 0, nb - 1); oy = (r() - 0.5) * 0.2; }
        else if (g.shape === 'dumbbell') { bi = k % 2; ox = (r() - 0.5) * 0.3 * Math.floor(k / 2); oy = (r() - 0.5) * 0.4 * Math.floor(k / 2); }

      const at = g.appType;
      const cnt = at === 'villi' ? lerp(6, 34, g.appCount) : at === 'cilia' ? lerp(18, 110, g.appCount) : at === 'spikes' ? lerp(8, 36, g.appCount) : at === 'tentacles' ? lerp(8, 46, g.appCount) : 0;

      this.pal = pal;

      this.appHi = mix(this.appRGB, [255, 255, 255], 0.55);
      this.hotRGB = mix(this.c2, [255, 255, 255], 0.4);

      this.seedOff = (g.seed % 997) / 37;

      const outer = Math.max(at === 'none' ? 0 : this.appLen * 1.3, this.flag.length ? this.flagLen * 1.05 : 0);
      this.half = this.rMax + outer + 0.45;
    }

    field(x, y) {
      let v = 0;
      const bx = this.bx, by = this.by, bs = this.bs2;

    boundary(a, o) {

      const x = lo * ca, y = lo * sa, e = 0.04;

      let m = Math.hypot(gx, gy);

    update(t) {
      this.t = t;
      const b = this.balls;
      for (let i = 0; i < this.nb; i++) {
        const q = b[i];
        this.bx[i] = q.x + Math.sin(t * q.f + q.ph) * q.amp;

        this.ny[k] = this.by[n.bi] + n.oy + Math.cos(t * 0.29 + n.ph) * 0.06;

    renderBody(t) {
      const N = this.N, E = this.E, d = this.img.data, step = (2 * E) / N;

          heat *= glow;

          else if (tex === 2) { const vn = nz(x * 2.0 + 3, y * 2.0 - t * 0.04); let rd = 1 - Math.abs(2 * vn - 1); rd = rd * rd; rd = rd * rd; rd = rd * rd; tt += rd * 0.45; texA = rd * 0.38; }
          else if (tex === 3) {
            const gx = x * 7 + 0.5, gy = y * 7 + 0.5, fx = gx - Math.floor(gx) - 0.5, fy = gy - Math.floor(gy) - 0.5;

          else { const u = (tt - 0.5) * 2; r = c1[0] + (c2[0] - c1[0]) * u; gg = c1[1] + (c2[1] - c1[1]) * u; b = c1[2] + (c2[2] - c1[2]) * u; }

    }

    /* sharp sprite: appendages + body + granules + nucleus flare. Heading = +x */
    drawSprite(t, U, noApps) {
      const half = this.half, size = Math.ceil(half * 2 * U);
      const c = this.sctx;
      if (this.sprite.width !== size) { this.sprite.width = this.sprite.height = size; }
      this.U = U;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, size, size);
      c.setTransform(U, 0, 0, U, size / 2, size / 2);
      c.lineCap = 'round'; c.lineJoin = 'round';
      const sp = lerp(0.5, 3.2, this.g.appSpeed) * (0.6 + 0.4 * this.motion);

      c.globalCompositeOperation = 'lighter';
      const hot = this.hotRGB;
      for (const q of this.gran) {
        const x = this.bx[q.bi] + q.ox + Math.sin(t * q.f + q.ph) * 0.05;

        n.globalAlpha = Math.min(1, it.life / 4) * (this.night ? 0.28 : 0.22);
        n.drawImage(P.orb(it.col, it.kind), it.x - it.r, it.y - it.r, it.r * 2, it.r * 2);
      }
      n.globalAlpha = 1;
    }

    renderMid(c, t, u) {
      const night = this.night, blend = night ? 'lighter' : 'source-over', ok = night ? 'orb' : 'dorb';
      // colour accents
      c.globalCompositeOperation = blend;
      for (const s of this.spots) {
        const r = s.r * (1 + Math.sin(t * 0.5 + s.ph) * 0.06);
        c.globalAlpha = night ? 0.3 : 0.5;
        c.drawImage(P.orb(s.col, 'rings'), s.x - r, s.y - r, r * 2, r * 2);
        if (s.dot) { c.globalAlpha = night ? 0.6 : 0.5; c.fillStyle = night ? '#ffffff' : '#4a4f5c'; c.beginPath(); c.arc(s.x, s.y, 0.45 * u, 0, TAU); c.fill(); }
      }
      c.globalAlpha = 1;
      // bubbles: white pearl with a teal fleck
      for (const b of this.bubbles) {
        if (night) {
          c.lineWidth = Math.max(1, b.r * 0.08); c.strokeStyle = 'rgba(235,245,255,0.35)'; c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.stroke();
        } else {
          const fade = b.born != null ? Math.min(1, (t - b.born) / 2) : 1, r = b.r * (1 + Math.sin(t * 2 + b.ph) * 0.03);
          c.globalAlpha = fade;
          c.fillStyle = 'rgba(255,255,255,0.22)'; c.beginPath(); c.arc(b.x, b.y, r, 0, TAU); c.fill();
          c.strokeStyle = 'rgba(70,95,130,0.22)'; c.lineWidth = Math.max(1, r * 0.07); c.stroke();
          c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = Math.max(1, r * 0.08);
          c.beginPath(); c.arc(b.x, b.y, r * 0.72, Math.PI * 1.1, Math.PI * 1.45); c.stroke();
          c.globalAlpha = 1;
        }
      }
      // food
      c.globalCompositeOperation = night ? 'lighter' : 'source-over';
      for (const f of this.food) {
        c.globalAlpha = Math.min(1, (t - f.born) / 1.5) * (0.65 + 0.3 * Math.sin(t * 1.1 + f.ph)) * (night ? 1 : 0.8);
        const col = night ? f.col : '#ffffff';
        c.drawImage(P.orb(col, 'soft'), f.x - f.r * 2.5, f.y - f.r * 2.5, f.r * 5, f.r * 5);
      }
      c.globalAlpha = 1; c.globalCompositeOperation = blend;
      // tiny rings
      for (const r of this.rings) {
        const sy = Math.max(0.08, Math.abs(Math.cos(r.tilt))), pulse = 1 + Math.sin(t * 1.4 + r.ph) * 0.04;
        c.save(); c.translate(r.x, r.y); c.rotate(r.rot);
        c.strokeStyle = night ? '#e8f4ff' : r.col; c.globalAlpha = 0.55; c.lineWidth = 0.3 * u;
        c.setLineDash([0.4 * u, 0.6 * u]);
        c.beginPath(); c.ellipse(0, 0, r.r * pulse, r.r * sy * pulse, 0, 0, TAU); c.stroke();
        c.setLineDash([]);
        c.globalAlpha = 0.7; c.fillStyle = night ? '#ffffff' : r.col; c.beginPath(); c.arc(0, 0, 0.35 * u, 0, TAU); c.fill();
        c.restore();
      }
      c.globalAlpha = 1;
      // threads
      for (const f of this.fils) {
        if (f.deep) continue;
        const col = hex(f.col), n = f.pts.length;
        const pts = f.pts.map((p, i) => {
          if (i === 0 || i === n - 1) return p;
          const a = f.pts[i - 1], b = f.pts[i + 1], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, w = Math.sin(i * 0.7 - t * 3 + f.id) * 0.7 * u;
          return { x: p.x - (dy / d) * w, y: p.y + (dx / d) * w };
        });
        c.beginPath(); c.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < n - 1; i++) { const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2; c.quadraticCurveTo(pts[i].x, pts[i].y, mx, my); }
        c.lineTo(pts[n - 1].x, pts[n - 1].y);
        c.lineWidth = 1.3 * u; c.strokeStyle = rgba(col, 0.16); c.stroke();
        c.lineWidth = 0.32 * u; c.strokeStyle = rgba(night ? mix(col, [255, 255, 255], 0.4) : mix(col, [30, 40, 70], 0.15), 0.7); c.stroke();
        c.fillStyle = rgba(col, 0.75);
        for (let i = 0; i < n; i += 3) { c.beginPath(); c.arc(pts[i].x, pts[i].y, 0.45 * u, 0, TAU); c.fill(); }
      }
      // cocci
      c.globalAlpha = night ? 0.65 : 0.85;
      const ca0 = c.globalAlpha;
      for (const k of this.cocci) { if (k.deep) continue; c.globalAlpha = ca0 * (k.a == null ? 1 : k.a); const r = k.r * (1 + Math.sin(t * 1.3 + k.ph) * 0.04); c.drawImage(P.orb(k.col, ok), k.x - r * 1.28, k.y - r * 1.28, r * 2.56, r * 2.56); }
      // rods
      c.globalAlpha = 0.75;
      for (const r of this.rods) {
        if (r.deep) continue;
        const col = hex(r.col), ca = Math.cos(r.a), sa = Math.sin(r.a), hl = r.len / 2;
        const x0 = r.x - ca * hl, y0 = r.y - sa * hl, x1 = r.x + ca * hl, y1 = r.y + sa * hl;
        c.lineCap = 'round'; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1);
        c.lineWidth = r.w; c.strokeStyle = rgba(col, night ? 0.35 : 0.3); c.stroke();
        c.lineWidth = r.w * 0.4; c.strokeStyle = rgba(night ? mix(col, [255, 255, 255], 0.5) : mix(col, [30, 40, 70], 0.2), 0.45); c.stroke();
        c.lineWidth = 0.15 * u; c.strokeStyle = rgba(col, 0.55); c.beginPath();
        for (let i = 0; i < 8; i++) {
          const s = (i % 4) / 3 - 0.5, side = i < 4 ? 1 : -1;
          const bx = r.x + ca * s * r.len * 0.8 - sa * side * r.w * 0.5, by = r.y + sa * s * r.len * 0.8 + ca * side * r.w * 0.5;
          const sw = Math.sin(t * 9 + i + r.ph) * 0.4;
          c.moveTo(bx, by); c.lineTo(bx - sa * side * 1.0 * u - ca * sw * u, by + ca * side * 1.0 * u - sa * sw * u);
        }
        c.stroke();
      }
      // tadpoles
      for (const a of this.tads) {
        if (a.deep) continue;
        const col = hex(a.col), v = Math.hypot(a.vx, a.vy) || 1, dx = a.vx / v, dy = a.vy / v;
        c.lineWidth = 0.25 * u; c.strokeStyle = rgba(col, 0.6); c.beginPath(); c.moveTo(a.x, a.y);
        for (let i = 1; i <= 5; i++) { const s = i * 0.9 * u, w = Math.sin(t * 14 + a.ph - i * 0.9) * i * 0.18 * u; c.lineTo(a.x - dx * s - dy * w, a.y - dy * s + dx * w); }
        c.stroke();
        c.drawImage(P.orb(a.col, ok), a.x - a.s * 1.3, a.y - a.s * 1.3, a.s * 2.6, a.s * 2.6);
      }
      c.globalAlpha = 1;
      // dissolving organisms
      for (const p of this.particles) {
        c.globalAlpha = Math.max(0, p.quick ? Math.min(1, p.life / 0.15, (p.max - p.life) / 0.35) : Math.min(1, p.life / 0.6, (p.max - p.life) / 3)) * 0.8;
        c.drawImage(P.orb(p.col, 'soft'), p.x - p.r * 2.5, p.y - p.r * 2.5, p.r * 5, p.r * 5);
      }
      c.globalAlpha = 1;
      // drop ripples
      for (const r of this.ripples) {
        const k = r.t / 3;
        for (let j = 0; j < 3; j++) {
          const kk = k - j * 0.12; if (kk <= 0) continue;
          c.strokeStyle = night ? `rgba(220,240,255,${(0.5 * (1 - kk)).toFixed(3)})` : `rgba(60,90,130,${(0.35 * (1 - kk)).toFixed(3)})`;
          c.lineWidth = (1.5 - kk) * u * 0.4;
          c.beginPath(); c.arc(r.x, r.y, kk * 34 * u * (r.scale || 1), 0, TAU); c.stroke();
        }
      }
      // organisms: aura + concentric breath + body
      const U = this.U;
      // organism bodies are rebuilt within a time budget per frame (oldest first); on a normal machine that is every
      // body every frame, on a slow one the newest image dissolves out of the previous one so nothing steps
      const now = performance.now(), t0 = now, msBudget = QUALITY[this.q || 0].ms;
      const rebuild = (s) => {
        const tt = t + s.ph * 50;
        s.m.update(tt); s.size = s.m.drawSprite(tt, U * s.g.size, true); s.img = s.m.compose(tt);
        if (s.tBuilt) s.interval = s.interval ? s.interval * 0.8 + (now - s.tBuilt) * 0.2 : now - s.tBuilt;
        s.tBuilt = now; s.built = this.frameN;
      };
      for (const s of this.specimens) if (!s.img || s.state !== 'alive') rebuild(s);
      const queue = this.specimens.filter((s) => s.state === 'alive' && s.built !== this.frameN).sort((a, b) => a.built - b.built);
      // steady cadence: how many bodies fit in the budget is estimated from the measured average cost,
      // so each body is refreshed at a regular rhythm instead of whenever time happens to be left over
      const cost = this.bodyCost || 1.5, n = clamp(Math.floor(msBudget / cost), 2, queue.length);
      for (let k = 0; k < n && k < queue.length; k++) rebuild(queue[k]);
      if (n > 0 && queue.length) { const per = (performance.now() - t0) / Math.max(1, Math.min(n, queue.length)); this.bodyCost = this.bodyCost ? this.bodyCost * 0.95 + per * 0.05 : per; }
      for (const s of this.specimens) {
        const tt = t + s.ph * 50, aura = s.g.aura == null ? 0.6 : s.g.aura;
        const R0 = s.m.rMax * U * s.g.size * s.scale * this.crowdK;
        if (aura > 0.02) {
          c.globalCompositeOperation = blend;
          c.globalAlpha = s.alpha * aura * (night ? 0.35 : 0.5);
          const ar = R0 * (2.3 + Math.sin(t * 0.7 + s.ph) * 0.12);
          c.drawImage(P.orb(toHex(s.col.aura), 'soft'), s.x - ar, s.y - ar, ar * 2, ar * 2);
          const rc = s.col.cr;
          c.lineWidth = 0.3 * u;
          for (let k = 0; k < 2; k++) {
            const ph = ((t * 0.1 + k / 2 + s.ph) % 1);
            const rr = R0 * (1.2 + ph * 0.8);
            c.globalAlpha = s.alpha * aura * 0.3 * Math.sin(ph * Math.PI) * (night ? 0.8 : 0.6);
            c.strokeStyle = rgba(night ? mix(rc, [255, 255, 255], 0.5) : rc, 1);
            c.beginPath(); c.arc(s.x, s.y, rr, 0, TAU); c.stroke();
          }
        }
        c.globalCompositeOperation = 'source-over';
        const size = s.size, img = s.img;
        const blur = Math.abs(s.z || 0) * 1.2 * this.dpr;
        c.save();
        c.translate(s.x, s.y); c.rotate(s.heading + Math.sin(t * 1.1 + s.ph) * 0.07);
        const wb = 1 + s.wobble * 0.045 * Math.sin(s.timer * 9);
        c.scale(s.scale * this.crowdK * wb, s.scale * this.crowdK / wb);
        c.globalAlpha = s.alpha;
        if (blur > 0.12) c.filter = `blur(${blur.toFixed(2)}px)`;
        // appendages animate every frame; the heavy body image is refreshed on a budget
        const Us = U * s.g.size;
        c.save(); c.scale(Us, Us); c.globalAlpha = s.alpha * 0.92; s.m.drawLiveApps(c, tt, night); c.restore();
        c.globalAlpha = s.alpha;
        c.drawImage(img, -size / 2, -size / 2);
        c.restore();
      }
    }

    updateHud() {
      const alive = this.specimens.filter((s) => s.state !== 'dying').length;
      this.$count.textContent = `Specimens ${String(alive).padStart(2, '0')} / ${this.max}`;
      const sec = Math.floor((performance.now() - this.start) / 1000);
      this.$time.textContent = `T + ${String(Math.floor(sec / 3600)).padStart(2, '0')}:${String(Math.floor(sec / 60) % 60).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
      const cam = this.cam();
      for (const s of this.specimens) {
        if (!s.tag) continue;
        const show = this.showAllTags || (s.tagUntil && this.t < s.tagUntil);
        s.tag.classList.toggle('on', !!show && s.state !== 'dying');
        if (show) {
          const x = (this.cx + s.x - cam.x + s.rad * 0.9) / this.dpr, y = (this.cy + s.y - cam.y - s.rad * 0.6) / this.dpr;
          s.tag.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
        }
      }
    }
    toggleTags() {
      this.showAllTags = !this.showAllTags;
      this.specimens.forEach((s) => { if (!s.tag) this.showTag(s, 0); });
    }
  }

  function temperName(id) { const t = P.TEMPERS.find((q) => q.id === id); return t ? t.name : ''; }
  function toHex(c) { const q = (v) => Math.max(0, Math.min(255, Math.round(v / 8) * 8)).toString(16).padStart(2, '0'); return '#' + q(c[0]) + q(c[1]) + q(c[2]); }
  function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) * 1.4; }
  function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
  function lerpAng(a, b, t) { return a + angDiff(a, b) * t; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function elastic(k) { if (k <= 0) return 0.2; if (k >= 1) return 1; return 1 - Math.pow(2, -9 * k) * Math.cos(k * 9) * 0.8; }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
  P.escapeHtml = escapeHtml;
  P.Dish = Dish;
  P.MODES = MODES;
})();

<script>
/* Petri v2 — specimen builder */
(function () {
  'use strict';
  const P = window.Petri;
  const { TAU, lerp } = P;

  const SECTIONS = [
    { n: '01', title: 'Form', items: [
      { key: 'shape', type: 'chips', options: () => P.SHAPES },
      { key: 'scale', label: 'Size' },
      { key: 'length', label: 'Length' },
      { key: 'width', label: 'Girth' },
      { key: 'pinch', label: 'Constriction', show: (g) => g.shape === 'dumbbell' },
      { key: 'fluidity', label: 'Fluidity' },
      { key: 'lumpiness', label: 'Lumpiness' },
    ] },
    { n: '02', title: 'Membrane', items: [
      { key: 'transparency', label: 'Translucency' },
      { key: 'rim', label: 'Rim glow' },
      { key: 'aura', label: 'Aura' },
      { key: 'haze', label: 'Haze · defocus' },
    ] },
    { n: '03', title: 'Interior', items: [
      { key: 'nuclei', label: 'Nuclei', min: 0, max: 4, step: 1 },
      { key: 'nucleusSize', label: 'Nucleus size', show: (g) => g.nuclei > 0 },
      { key: 'glow', label: 'Luminescence', show: (g) => g.nuclei > 0 },
      { key: 'granules', label: 'Granules' },
      { key: 'texture', type: 'chips', options: () => P.TEXTURES },
    ] },
    { n: '04', title: 'Appendages', items: [
      { key: 'appType', type: 'chips', options: () => P.APPS },
      { key: 'appCount', label: 'Count', show: (g) => g.appType !== 'none' },
      { key: 'appLength', label: 'Length', show: (g) => g.appType !== 'none' },
      { key: 'appThickness', label: 'Thickness', show: (g) => g.appType !== 'none' },
      { key: 'appCurl', label: 'Curl', show: (g) => g.appType !== 'none' },
      { key: 'appSpeed', label: 'Beat speed', show: (g) => g.appType !== 'none' },
      { key: 'flagella', label: 'Flagella', min: 0, max: 3, step: 1 },
      { key: 'flagLength', label: 'Flagellum length', show: (g) => g.flagella > 0 },
    ] },
    { n: '05', title: 'Colour', items: [
      { key: 'palette', type: 'palette' },
      { key: 'appColor', type: 'appcolor', label: 'Appendage colour' },
    ] },
    { n: '06', title: 'Temperament', items: [
      { key: 'temperament', type: 'chips', options: () => P.TEMPERS, desc: true },
    ] },
  ];

  class Creator {
    constructor(root, opts) {
      this.root = root; this.opts = opts || {};
      this.g = P.makeGenome(P.presets[2].g); this.g.name = P.makeName();
      this.activePreset = 2;
      this.build();
      this.preview = new Preview(this.root.querySelector('.pv-canvas'), this.g);
      this.sync();
    }

    build() {
      const r = this.root;
      r.classList.add('creator');
      r.innerHTML = `
        <header class="cr-head">
          <div class="cr-brand">Foreign<br>Organisms</div>
          <div class="cr-meta">Specimen builder<br><span>Iteration 13</span></div>
        </header>
        <div class="pv">
          <canvas class="pv-canvas"></canvas>
          <div class="pv-label"><b class="pv-fig">Fig. —</b><span class="pv-name"></span><em class="pv-latin"></em><small class="pv-temper"></small></div>
          <div class="pv-ticks"><span>0</span><span>25</span><span>50 µm</span></div>
        </div>
        <div class="cr-presets"></div>
        <div class="cr-scroll"><div class="cr-sections"></div>
          <section class="cr-sec"><div class="sec-h"><span>07</span>Name</div>
            <div class="name-row"><input class="name-in" maxlength="16" spellcheck="false"><button class="btn-ghost dice" title="New name">↻</button></div>
          </section>
        </div>
        <footer class="cr-foot">
          <button class="btn-ghost rnd">Randomise</button>

      // пресеты с миниатюрами
      const pr = r.querySelector('.cr-presets');
      P.presets.forEach((p, i) => {
        const b = document.createElement('button'); b.className = 'preset';
        const cv = document.createElement('canvas'); cv.width = cv.height = 120;

        b.onclick = () => { this.applyPreset(i); };
        pr.append(b);
        const m = new P.Microbe(P.makeGenome(Object.assign({ seed: 1000 + i * 77 }, p.g, { haze: 0 })), { res: 72 });
        m.update(2);
        const U = 120 / (m.half * 2) * 0.95, size = m.drawSprite(2, U), x = cv.getContext('2d');
        x.translate(60, 60); x.rotate(-0.5); x.drawImage(m.sprite, -size / 2, -size / 2);
      });
      // секции
      const host = r.querySelector('.cr-sections');
      this.controls = [];
      SECTIONS.forEach((sec) => {
        const el = document.createElement('section'); el.className = 'cr-sec';
        el.innerHTML = `<div class="sec-h"><span>${sec.n}</span>${sec.title}</div>`;

        host.append(el);
      });
      this.$name = r.querySelector('.name-in');
      this.$name.oninput = () => { this.g.name = this.$name.value || '—'; this.updateLabel(); };
      r.querySelector('.dice').onclick = () => { this.g.name = P.makeName(); this.sync(); };
      r.querySelector('.rnd').onclick = () => { this.g = P.randomGenome(); this.activePreset = -1; this.sync(true); };

    }

    makeControl(it) {
      const el = document.createElement('div');
      const c = { it, el };
      if (it.type === 'chips') {
        el.className = 'ctl chips' + (it.desc ? ' with-desc' : '');
        it.options().forEach((o) => {
          const b = document.createElement('button'); b.className = 'chip'; b.dataset.v = o.id;
          b.innerHTML = o.name + (it.desc ? `<small>${o.desc}</small>` : '');

          el.append(b);
        });
        c.set = (g) => el.querySelectorAll('.chip').forEach((b) => b.classList.toggle('on', b.dataset.v === g[it.key]));
      } else if (it.type === 'palette') {
        el.className = 'ctl swatches';
        P.palettes.forEach((p, i) => {
          const b = document.createElement('button'); b.className = 'sw'; b.title = p.name;
          b.style.background = `radial-gradient(circle at 50% 55%, ${p.hot} 0%, ${p.mid} 38%, ${p.edge} 72%, ${p.rim} 86%, transparent 92%)`;
          b.onclick = () => { this.g.palette = i; this.changed('palette'); };
          el.append(b);
        });
        const lab = document.createElement('div'); lab.className = 'sw-name'; el.append(lab);
        c.set = (g) => { el.querySelectorAll('.sw').forEach((b, i) => b.classList.toggle('on', i === g.palette)); lab.textContent = P.palettes[g.palette].name; };
      } else if (it.type === 'appcolor') {
        el.className = 'ctl swatches small';
        el.innerHTML = `<div class="ctl-l">${it.label}</div>`;
        P.appSwatches.forEach((col) => {
          const b = document.createElement('button'); b.className = 'sw sm'; b.dataset.v = col;
          if (col === 'auto') { b.textContent = 'A'; b.title = 'Auto: from palette'; } else b.style.background = col;
          b.onclick = () => { this.g.appColor = col; this.changed('appColor'); };
          el.append(b);
        });
        c.set = (g) => el.querySelectorAll('.sw').forEach((b) => b.classList.toggle('on', b.dataset.v === g.appColor));
      } else {
        el.className = 'ctl range';
        const min = it.min != null ? it.min : 0, max = it.max != null ? it.max : 1, step = it.step || 0.01;
        el.innerHTML = `<label><span>${it.label}</span><output></output></label><input type="range" min="${min}" max="${max}" step="${step}">`;
        const inp = el.querySelector('input'), out = el.querySelector('output');
        const fmt = (v) => (step >= 1 ? String(v) : String(Math.round(v * 100)).padStart(2, '0'));
        inp.oninput = () => { const v = parseFloat(inp.value); this.g[it.key] = v; out.textContent = fmt(v); this.fill(inp); this.changed(it.key, true); };
        c.set = (g) => { inp.value = g[it.key]; out.textContent = fmt(g[it.key]); this.fill(inp); };
      }
      return c;
    }
    fill(inp) { const p = ((inp.value - inp.min) / (inp.max - inp.min)) * 100; inp.style.setProperty('--p', p + '%'); }

    applyPreset(i) {
      const keepName = this.g.name;
      this.g = P.makeGenome(P.presets[i].g); this.g.name = keepName;
      this.activePreset = i; this.sync(true);
    }
    changed(key, fromSlider) {
      if (!fromSlider) this.activePreset = -1;
      if (key === 'shape' || key === 'appType' || key === 'nuclei' || key === 'flagella') this.refreshVisibility();
      if (!fromSlider) this.controls.forEach((c) => c.set(this.g));
      this.preview.setGenome(this.g);
      this.updateLabel();
      this.root.querySelectorAll('.preset').forEach((b, i) => b.classList.toggle('on', i === this.activePreset));
    }
    refreshVisibility() { this.controls.forEach((c) => { c.el.style.display = c.it.show && !c.it.show(this.g) ? 'none' : ''; }); }
    sync(anim) {
      this.controls.forEach((c) => c.set(this.g));
      this.refreshVisibility();
      this.$name.value = this.g.name || '';
      this.preview.setGenome(this.g, anim);
      this.updateLabel();
      this.root.querySelectorAll('.preset').forEach((b, i) => b.classList.toggle('on', i === this.activePreset));
    }
    updateLabel() {
      const r = this.root;
      r.querySelector('.pv-fig').textContent = `Fig. ${this.opts.nextFig ? this.opts.nextFig() : '—'}.`;
      r.querySelector('.pv-name').textContent = this.g.name || '—';
      r.querySelector('.pv-latin').textContent = P.latinName(this.g);
      const tp = P.TEMPERS.find((q) => q.id === this.g.temperament); r.querySelector('.pv-temper').textContent = tp ? tp.name + ' · ' + tp.desc : '';
    }

    send() {
      if (this.sending) return;
      this.sending = true;
      const g = Object.assign({}, this.g, { seed: this.g.seed });
      const btn = this.root.querySelector('.btn-send');
      btn.classList.add('busy');
      const done = () => {
        this.sending = false; btn.classList.remove('busy');
        // следующий микроб — вариация текущего
        const next = Object.assign({}, this.g, { seed: (Math.random() * 1e9) | 0, name: P.makeName() });
        this.g = next; this.sync(true); this.preview.appear();
      };
      if (this.opts.onSend) this.opts.onSend(g, this.preview, done);
      else done();
    }
  }

  /* ---------- превью в маленьком окуляре ---------- */
  class Preview {
    constructor(canvas, g) {
      this.c = canvas; this.ctx = canvas.getContext('2d');
      this.m = new P.Microbe(g, { res: 128 });
      this.t = 0; this.alpha = 1; this.scale = 1; this.hidden = false;
      this.bokeh = []; for (let i = 0; i < 18; i++) this.bokeh.push({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, r: P.rand(0.02, 0.09), col: P.pick(['#58cbe6', '#ff86c2', '#a58cff', '#ffcf98', '#86e2cc']), ph: Math.random() * TAU });
      new ResizeObserver(() => this.resize()).observe(canvas);
      this.resize();
      this.last = performance.now();
      requestAnimationFrame((n) => this.loop(n));
    }
    resize() {
      const r = this.c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
      this.dpr = dpr; this.S = Math.max(10, Math.round(Math.min(r.width, r.height) * dpr));
      this.c.width = this.c.height = this.S;
    }
    setGenome(g, anim) { this.m.setGenome(g); if (anim) { this.pop = 0; } }
    appear() { this.hidden = false; this.alpha = 0; this.pop = 0; }
    get U() { const k = P.lerp(0.62, 1, this.m.g.scale == null ? 0.5 : this.m.g.scale); return Math.min(this.S * 0.42 / this.m.half, this.S * 0.1) * k; }
    /* данные для анимации полёта */
    snapshot() {
      const rect = this.c.getBoundingClientRect();
      const U = this.U, size = this.m.drawSprite(this.t, U), img = this.m.compose(this.t);
      const copy = document.createElement('canvas'); copy.width = copy.height = size;
      copy.getContext('2d').drawImage(img, 0, 0);
      return { canvas: copy, size: size / this.dpr, cx: rect.left + rect.width / 2, cy: rect.top + rect.height / 2, U: U / this.dpr, rot: this.rot };
    }
    loop(now) {
      const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now; this.t += dt;
      const c = this.ctx, S = this.S, h = S / 2, t = this.t;
      c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
      c.clearRect(0, 0, S, S);
      c.save(); c.beginPath(); c.arc(h, h, h * 0.98, 0, TAU); c.clip();
      let g = c.createRadialGradient(h, h * 0.9, 0, h, h, h);
      g.addColorStop(0, '#fbfaf7'); g.addColorStop(0.75, '#f0f1f3'); g.addColorStop(1, '#e7e9ee');
      c.fillStyle = g; c.fillRect(0, 0, S, S);
      c.filter = `blur(${S * 0.012}px)`;
      for (const b of this.bokeh) {
        c.globalAlpha = 0.22 + 0.12 * Math.sin(t * 0.5 + b.ph);
        const o = P.orb(b.col, 'soft'), x = h + (b.x + Math.sin(t * 0.05 + b.ph) * 0.05) * h, y = h + (b.y + Math.cos(t * 0.04 + b.ph) * 0.05) * h, r = b.r * S;
        c.drawImage(o, x - r, y - r, r * 2, r * 2);
      }
      c.filter = 'none'; c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
      // микроб
      if (!this.hidden) {
        if (this.alpha < 1) this.alpha = Math.min(1, this.alpha + dt * 2);
        if (this.pop != null) { this.pop += dt; if (this.pop > 0.6) this.pop = null; }
        const popS = this.pop != null ? 1 + Math.sin((this.pop / 0.6) * Math.PI) * 0.06 : 1;
        this.m.update(t);
        const U = this.U, size = this.m.drawSprite(t, U), img = this.m.compose(t);
        this.rot = -0.4 + Math.sin(t * 0.25) * 0.35;
        const ar = this.m.rMax * U * 2.3, aura = this.m.g.aura == null ? 0.6 : this.m.g.aura;
        c.globalAlpha = this.alpha * aura * 0.5;
        c.drawImage(P.orb(this.m.pal.aura, 'soft'), h - ar, h - ar, ar * 2, ar * 2);
        c.globalAlpha = 1;
        c.save(); c.translate(h + Math.sin(t * 0.4) * S * 0.015, h + Math.cos(t * 0.33) * S * 0.015); c.rotate(this.rot); c.scale(popS, popS);
        c.globalAlpha = this.alpha;
        c.drawImage(img, -size / 2, -size / 2);
        c.restore();
      }
      // мягкий bloom-лайт
      c.restore();
      c.globalCompositeOperation = 'source-over';
      c.strokeStyle = 'rgba(40,46,60,0.4)'; c.lineWidth = this.dpr; c.beginPath(); c.arc(h, h, h * 0.98, 0, TAU); c.stroke();
      requestAnimationFrame((n) => this.loop(n));
    }
  }

  P.Creator = Creator;
})();

</script>
<script>
(function () {
  const P = window.Petri;
  const dish = new P.Dish(document.getElementById('dish'));
  window.dish = dish;

  const creator = new P.Creator(document.getElementById('creator'), {
    nextFig: () => dish.fig + 1,
    onSend: (g, preview, done) => {
      g.size = P.lerp(0.95, 1.55, g.scale == null ? 0.5 : g.scale) * P.rand(0.96, 1.04); // honour the Size slider
      const snap = preview.snapshot();
      const target = dish.pickArrival();
      preview.hidden = true;
      // летящая капля с микробом
      const fly = document.createElement('div'); fly.className = 'fly';
      snap.canvas.style.width = snap.size + 'px'; snap.canvas.style.height = snap.size + 'px';
      fly.append(snap.canvas); document.body.append(fly);
      const endScale = (target.cssScale * g.size * dish.crowdK) / snap.U;
      const x0 = snap.cx - snap.size / 2, y0 = snap.cy - snap.size / 2;
      const dx = target.clientX - snap.cx, dy = target.clientY - snap.cy;
      const rot0 = snap.rot * 180 / Math.PI;
      fly.style.left = x0 + 'px'; fly.style.top = y0 + 'px';
      const anim = fly.animate([
        { transform: `translate(0,0) rotate(${rot0}deg) scale(1)`, opacity: 1, filter: 'blur(0px)' },
        { transform: `translate(${dx * 0.18}px, ${dy * 0.18 - 40}px) rotate(${rot0 + 10}deg) scale(0.42)`, opacity: 1, filter: 'blur(0px)', offset: 0.28 },
        { transform: `translate(${dx * 0.8}px, ${dy * 0.8 - 30}px) rotate(${rot0 + 40}deg) scale(${Math.max(0.2, endScale * 0.55)})`, opacity: 0.95, filter: 'blur(1px)', offset: 0.78 },
        { transform: `translate(${dx}px, ${dy}px) rotate(${rot0 + 60}deg) scale(${endScale})`, opacity: 0, filter: 'blur(3px)' },
      ], { duration: 1500, easing: 'cubic-bezier(.45,.05,.35,1)', fill: 'forwards' });
      setTimeout(() => dish.spawn(g, { x: target.x, y: target.y }), 1250);
      anim.onfinish = () => { fly.remove(); done(); };
    },
  });

  // light menu
  const menu = document.querySelector('.light-menu'), list = menu.querySelector('.lm-list'), btn = menu.querySelector('.lm-btn');
  const SW = { pastel: 'radial-gradient(circle at 35% 35%, #ffd0e6, #c9d9ff 55%, #f4f2ee 80%)', lagoon: 'radial-gradient(circle at 35% 35%, #bff0ff, #7fd8d2 55%, #e9f2f4 80%)', night: 'radial-gradient(circle at 35% 35%, #8a6bff, #1b1f5a 55%, #05060f 80%)' };
  const DESC = { pastel: 'soft paper field, warm accents', lagoon: 'cool aqua wash', night: '488 nm, glowing organisms' };
  P.MODES.forEach((m, i) => {
    const b = document.createElement('button'); b.className = 'lm-item';
    const [kind, name] = m.label.split(' · ');
    b.innerHTML = `<span class="lm-sw" style="background:${SW[m.id]}"></span><span class="lm-t"><b>${name}</b><small>${kind.toLowerCase()} — ${DESC[m.id]}</small></span>`;
    b.onclick = () => { dish.setMode(i); menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); };
    list.append(b);
  });
  const syncMenu = (i) => { list.querySelectorAll('.lm-item').forEach((b, j) => b.classList.toggle('on', j === i)); menu.querySelector('.lm-cur').textContent = P.MODES[i].label.split(' · ')[1]; };
  dish.onMode(syncMenu); syncMenu(dish.modeIndex);
  btn.onclick = (e) => { e.stopPropagation(); const o = menu.classList.toggle('open'); btn.setAttribute('aria-expanded', String(o)); };
  document.addEventListener('click', (e) => { if (!menu.contains(e.target)) { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); } });

  const act = {
    mode: () => dish.nextMode(),
    tags: () => dish.toggleTags(),
    clear: () => dish.clear(),
    full: () => { const el = document.querySelector('.dish-wrap'); document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen(); },
    panel: () => document.body.classList.toggle('no-panel'),
  };
  document.querySelectorAll('.dish-tools button').forEach((b) => (b.onclick = () => act[b.dataset.act]()));
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k === 'm' || k === 'ь') act.mode();
    else if (k === 't' || k === 'е') act.tags();
    else if (k === 'f' || k === 'а') act.full();
    else if (k === 'h' || k === 'р') act.panel();
    else if (k === 'r' || k === 'к') dish.spawn(P.randomGenome());
    else if (k === 'q' || k === 'й') dish.cycleQuality();
    else if (e.key === 'Delete') act.clear();
  });
})();
</script>
</body>
